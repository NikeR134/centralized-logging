services:
  elasticsearch-data-init:
    image: busybox:1.36
    user: root
    command: ["sh", "-c", "chown -R 1000:0 /data && chmod 0770 /data"]
    volumes:
      - ./elasticsearch-data:/data

  elasticsearch:
    depends_on:
      elasticsearch-data-init:
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - ./elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  logstash:
    image: docker.elastic.co/logstash/logstash:8.13.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "5044:5044"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_DEFAULTROUTE: /app/dashboards#/view/springboot-logs-dashboard
    ports:
      - "5601:5601"

  app:
    build: .
    depends_on:
      - logstash
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/logs

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.13.4
    command: ["-e", "--strict.perms=false"]
    depends_on:
      - logstash
      - app
    user: root
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/logs:ro
      - ./filebeat-data:/usr/share/filebeat/data

  kibana-init:
    image: curlimages/curl:8.8.0
    depends_on:
      - kibana
      - filebeat
    entrypoint: ["sh", "/init/import-saved-objects.sh"]
    volumes:
      - ./kibana:/saved-objects:ro
      - ./scripts/import-saved-objects.sh:/init/import-saved-objects.sh:ro
    restart: "no"



